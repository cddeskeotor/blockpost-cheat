name: Build Romka 333 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zipalign apksigner wget unzip aria2

      - name: Download Game APK
        run: |
          # Скачиваем файл с Gofile через специальную утилиту
          aria2c -x 16 -s 16 --header="Cookie: accountToken=null" "https://gofile.io/d/sXpZWgkY" -o base.apk || wget -O base.apk "https://gofile.io/d/sXpZWgkY"

      - name: Decode APK
        run: |
          apktool d -f base.apk -o decoded

      - name: Inject permission
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n    <application|' decoded/AndroidManifest.xml

      - name: Inject overlay service
        run: |
          sed -i 's|</application>|<service android:name="com.rocket.overlay.OverlayService"/>\n    </application>|' decoded/AndroidManifest.xml

      - name: Copy smali classes
        run: |
          mkdir -p decoded/smali/com/rocket/overlay
          cp -r smali/* decoded/smali/com/rocket/overlay/

      - name: Build APK
        run: |
          apktool b decoded -o patched.apk
          zipalign -v 4 patched.apk aligned.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore rocket.keystore -alias rocket \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rocket123 -keypass rocket123 \
            -dname "CN=ROCKET"
          apksigner sign --ks rocket.keystore --ks-pass pass:rocket123 \
            --out rocket_final.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rocket-apk
          path: rocket_final.apk
